baseURL: https://meshserbia.com
locale: sr-Latn
title: MeshSerbia

module:
  imports:
    - path: github.com/imfing/hextra

enableEmoji: true

outputs:
  home: [HTML, llms]
  page: [HTML, llms, markdown]
  section: [HTML, RSS, markdown]

defaultContentLanguage: sr_Latn
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: MeshSerbia
  sr_Latn:
    label: Srpski - Latinica
    locale: sr-Latn
    weight: 2
    title: MeshSerbia
  sr_Cyrl:
    label: Српски - Ћирилица
    locale: sr-Cyrl
    weight: 3
    title: MeshSerbia

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: documentation
      name: Dokumentacija
      pageRef: /docs/introdukcija/
      weight: 1
    - identifier: showcase
      name: Mapa
      pageRef: /showcase
      weight: 2
    - identifier: blog
      name: Vesti
      pageRef: /blog
      weight: 3
    - identifier: about
      name: O nama
      pageRef: /about
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: Forum
      weight: 6
      url: "https://telemetrija.sabering.xyz/q/UknZ12sKg"
      params:
        type: link
        icon: github
    - name: Telegram
      weight: 7
      url: "https://telemetrija.sabering.xyz/q/yMrziYWlf"
      params:
        icon: telegram

  sidebar:
    - identifier: more
      name: Više
      params:
        type: separator
      weight: 1
    - identifier: about
      name: O nama
      pageRef: /about
      weight: 2
    - identifier: MeshDocs
      name: Zvanični Meshtastic® site ↗
      url: "https://meshtastic.org/"
      weight: 3

params:
  description: "MeshSerbia je najveća srpska zajednica posvećena Meshtastic mreži. Jasni vodiči, praktični tutorijali i saveti za izradu meshtastic uređaja. Centralno mesto za svakoga ko želi stabilnu, otvorenu i pouzdanu mesh komunikaciju u Srbiji.!"
  keywords:
    - "meshtastic serbia"
    - "mesh serbia"
    - "mesh mreža srbija"
    - "lora mesh srbija"
    - "meshtastic community serbia"
    - "meshtastic čvorovi"
    - "lora nodovi srbija"
    - "meshtastic guide"
    - "meshtastic tutorials"
    - "meshtastic setup"
    - "meshtastic mqtt integration"
    - "meshtastic internet gateway"
    - "meshtastic solar node"
    - "mesh networking serbia"
    - "offline communication serbia"
    - "lora communication serbia"
    - "long range mesh"
    - "meshtastic android"
    - "meshtastic firmware"
    - "meshtastic hardware"
    - "meshtastic projects serbia"
    - "meshserbia"
    - "meshserbia community"
    - "meshtastic regional network"
    - "open-source mesh serbia"
    - "distributed communication serbia"
    - "ad-hoc komunikacija"
    - "radio mesh mreže"
    - "mesh komunikacija balkan"
    - "lora diy projekti"

  externalLinkDecoration: true

  banner:
    key: "announcement"
    message: "VAŽNO: Zbog zagušenja mreže, pređite na novi kanal `Srbija` radi stabilne komunikacije"

  analytics:
    umami:
      serverURL: "https://telemetrija.sabering.xyz"
      websiteID: "e207074d-b695-4f3a-a9e7-10323e14425d"
      scriptName: "script.js"

  comments:
    enable: true
    type: giscus
    giscus:
      repo: "Sabering1/meshserbia-website"
      repoId: "R_kgDOOZY74Q"
      category: "Pitanja i odgovori"
      categoryId: "DIC_kwDOOZY74c4CvfEi"
      lang: "hbs"
      inputPosition: "top"
      reactionsEnabled: "0"
      strict: "1"
      mapping: "pathname"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      dark: favicon.svg
      width: 60
      height: 40
      link: /
    width: wide

  page:
    width: normal
    contextMenu:
      enable: true
      links:
        - name: "Pitaj ChatGPT"
          url: "https://chatgpt.com?content={markdown_url}"
          icon: "sparkles"
    

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
    article:
      displayPagination: true

  highlight:
    copy:
      enable: true
      display: hover
